# Gradle 构建参数
# org.gradle.jvmargs 中显式指定 -Djava.io.tmpdir：本机用户目录含非 ASCII 字符，
# Kotlin 编译器在默认临时目录（C:\Users\古成学\AppData\Local\Temp）下会报
# AccessDeniedException，指向项目内的纯 ASCII 目录可规避。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.io.tmpdir=D:/DSHin/HoMiSe/tools/tmp
org.gradle.parallel=true
org.gradle.caching=true
# 关闭配置缓存：AGP 持续在 tools/android-home 下写入缓存目录，
# 会导致配置缓存条目反复失效并打印告警，实际收益小于噪声（见 NETWORK.md）。
org.gradle.configuration-cache=false

# Kotlin 编译策略：本沙箱不提供本地套接字，Kotlin 守护进程反复启动/重连失败
# （日志出现 4 次 "Could not connect to Kotlin compile daemon"）后才回退到进程内编译。
# 直接固定为进程内编译，消除噪声与等待。见 NETWORK.md。
kotlin.compiler.execution.strategy=in-process

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# 仅打包当前 ABI 之外的资源不额外处理，保持默认
android.nonTransitiveRClass=true

# 构建使用的 JDK 17（本机默认 JDK 27 不被 AGP 支持，详见 NETWORK.md）
# 若未通过 JAVA_HOME 指定，可在命令行追加：
#   -Dorg.gradle.java.home=D:/DSHin/HoMiSe/tools/jdk-17
